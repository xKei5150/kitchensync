name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual-only trigger for the deploy-prod job (production rollout). Never
  # auto-fires on push/PR; the deploy-prod job gates itself on
  # github.event_name == 'workflow_dispatch'.
  workflow_dispatch:

jobs:
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-playwright-artifacts
          path: apps/admin-web/test-results
          if-no-files-found: ignore

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Firebase configuration
        env:
          KITCHENSYNC_CI_FIREBASE_OPTIONS_DEV: ${{ secrets.KITCHENSYNC_CI_FIREBASE_OPTIONS_DEV }}
          KITCHENSYNC_CI_FIREBASE_OPTIONS_PROD: ${{ secrets.KITCHENSYNC_CI_FIREBASE_OPTIONS_PROD }}
        run: bash .github/scripts/restore-firebase-config.sh flutter-only

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Enforce 80% coverage
        run: |
          sudo apt-get install -y lcov
          lcov --summary coverage/lcov.info | tee coverage_summary.txt
          PCT=$(grep -oP 'lines\.\.\.\.\.\.: \K[0-9.]+' coverage_summary.txt)
          PCT_INT=${PCT%.*}
          if [ "$PCT_INT" -lt 80 ]; then
            echo "Coverage $PCT% < 80%" >&2
            exit 1
          fi

  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21 for Firebase Local Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Firebase config and rollout gates
        run: node tools/verify-firebase-gates.mjs && node tools/firebase-gates/test-gates.mjs
      - name: Install Functions dependencies
        run: npm --prefix functions ci
      - name: Lint Functions
        run: npm --prefix functions run lint
      - name: Build Functions
        run: npm --prefix functions run build
      - name: Test Functions
        run: npm --prefix functions test
      - name: Install rules-tests deps
        working-directory: tools/rules_tests
        run: npm ci
      - name: Run rules tests
        working-directory: tools/rules_tests
        run: npm test
      - name: Run Functions emulator tests
        run: tools/firebase-gates/firebase.sh --config firebase.dev.json emulators:exec --only auth,firestore,functions,storage --project kitchensync-dev-da503 "npm --prefix functions run test:emulator"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21 for Firebase Local Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Firebase configuration
        env:
          KITCHENSYNC_CI_FIREBASE_OPTIONS_DEV: ${{ secrets.KITCHENSYNC_CI_FIREBASE_OPTIONS_DEV }}
          KITCHENSYNC_CI_FIREBASE_OPTIONS_PROD: ${{ secrets.KITCHENSYNC_CI_FIREBASE_OPTIONS_PROD }}
          KITCHENSYNC_CI_GOOGLE_SERVICES_JSON_DEV: ${{ secrets.KITCHENSYNC_CI_GOOGLE_SERVICES_JSON_DEV }}
        run: bash .github/scripts/restore-firebase-config.sh android-integration

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: npm --prefix functions ci
      - name: Run signed-in callable gate on an owned Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: tools/firebase-gates/run-flutter-callable-android.sh emulator-5554


  deploy-prod:
    # Manual-only production rollout. Never runs on push/PR; it is triggered
    # explicitly from the Actions UI / API (workflow_dispatch) and waits for all
    # test jobs to pass first.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [admin-web, flutter, rules-tests, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore production deploy configuration
        env:
          KITCHENSYNC_CI_FUNCTIONS_ENV_PROD: ${{ secrets.KITCHENSYNC_CI_FUNCTIONS_ENV_PROD }}
          KITCHENSYNC_CI_ADMIN_WEB_ENV_PROD: ${{ secrets.KITCHENSYNC_CI_ADMIN_WEB_ENV_PROD }}
        run: |
          set -eu
          umask 077
          printf '%s' "$KITCHENSYNC_CI_FUNCTIONS_ENV_PROD" > functions/.env.kitchensync-prod-8d6fd
          printf '%s' "$KITCHENSYNC_CI_ADMIN_WEB_ENV_PROD" > apps/admin-web/.env.production
      - name: Install Functions dependencies
        run: npm --prefix functions ci
      - name: Build Functions
        run: npm --prefix functions run build
      - name: Install admin web dependencies
        run: npm --prefix apps/admin-web ci
      - name: Build admin web (Hosting dist)
        run: npm --prefix apps/admin-web run build
      - name: Run production rollout
        env:
          # Credentials / configuration must be added in the repo settings
          # (Settings > Secrets and variables > Actions) before first use:
          #   - FIREBASE_TOKEN: a Firebase CLI CI token with deploy rights on
          #     kitchensync-prod-8d6fd (used by tools/firebase-gates/firebase.sh).
          #   - KITCHENSYNC_CI_FIREBASE_OPTIONS_PROD: production Firebase options
          #     (same secret already used by the flutter/integration jobs).
          # The functions runtime env file (functions/.env.kitchensync-prod-8d6fd)
          # must be present for the functions deploy to pick up prod env vars.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: tools/firebase-gates/rollout-prod.sh --confirm-prod
